name: Subscription Renewal Check

on:
  push:
    paths:
      - 'subscriptions.json'   # runs immediately whenever the app commits a change
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC ≈ 08:00-09:00 Israel time (adjust if you want a different hour)
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check renewals and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_renewals.py
